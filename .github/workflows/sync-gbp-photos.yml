name: Sync Google Business Profile photos

on:
  schedule:
    - cron: '17 3 * * *' # nightly, 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull new listing photos into public/Gallery
        env:
          GOOGLE_PLACES_API: ${{ secrets.GOOGLE_PLACES_API }}
        run: node scripts/sync-gbp-photos.mjs

      - name: Commit and push new photos
        run: |
          if [ -n "$(git status --porcelain public/Gallery)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/Gallery
            git commit -m "Add new Google Business Profile photos to gallery"
            git push
          else
            echo "No new photos."
          fi
